<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>受講生一覧</title>
</head>
<body>
<h1>受講生一覧</h1>
<table border="1">
  <thead>
    <tr>
      <th>ID</th>
      <th>名前</th>
      <th>カナ名</th>
      <th>ニックネーム</th>
      <th>メールアドレス</th>
      <th>地域</th>
      <th>年齢</th>
      <th>性別</th>
    </tr>
  </thead>
  <tbody>
  <tr th:each="studentDetail : ${studentList}">
    <td th:text="${studentDetail.student.id}">1</td>
    <td th:text="${studentDetail.student.name}">浄法寺常之佑</td>
    <td th:text="${studentDetail.student.kanaName}">ジョウホウジジョウノスケ</td>
    <td th:text="${studentDetail.student.nickname}">ジョウ</td>
    <td th:text="${studentDetail.student.email}">gunjam-500@email.com</td>
    <td th:text="${studentDetail.student.area}">宮城県</td>
    <td th:text="${studentDetail.student.age}">25</td>
    <td th:text="${studentDetail.student.sex}">男</td>
  </tr>
  </tbody>
</table>
</body>
</html>
